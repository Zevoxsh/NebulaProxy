# NebulaProxyV4 unattended install answers for the Debian installer.
# Baked into a custom ISO by os/build/build-iso.sh (auto=true priority=critical
# file=/cdrom/preseed.cfg on the boot line) — insert USB, boot, walk away.

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string nebulaproxy
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts — no root login; one sudo admin user in the docker group.
# The password below is an installer-time placeholder only, needed because
# the installer requires *something*. It never reaches the app (NebulaProxy's
# own credentials are set through its web setup wizard on first boot) — change
# it immediately after install: `passwd nebula`.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string NebulaProxy Admin
d-i passwd/username string nebula
d-i passwd/user-password password nebula
d-i passwd/user-password-again password nebula
d-i user-setup/allow-password-weak boolean true
d-i passwd/user-default-groups string sudo docker

### Clock / timezone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

### Partitioning — guided, entire disk, single partition (appliance: no
### dual-boot, no LVM complexity to reason about during recovery).
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true

### Base system / packages
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl ca-certificates gnupg2 sudo git
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note

### Late command — this is where NebulaProxyV4 actually gets installed.
# The nebulaproxy-src directory is baked onto the install media by
# os/build/build-iso.sh; install-late.sh (already inside that tree) then
# handles Docker + systemd setup inside the chroot.
d-i preseed/late_command string \
    cp -a /cdrom/nebulaproxy-src /target/opt/nebulaproxy; \
    in-target bash /opt/nebulaproxy/os/scripts/install-late.sh
